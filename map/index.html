<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Find Flash merchants near you — 34+ locations across Jamaica accepting Bitcoin payments.">
  <meta property="og:title" content="Flash Merchant Map | Flash">
  <meta property="og:description" content="Find Flash merchants near you — 34+ locations across Jamaica accepting Bitcoin payments.">
  <meta property="og:url" content="https://getflash.io/map/">
  <meta property="og:image" content="https://getflash.io/assets/img/download-button-og.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@LNFlash">
  <title>Flash Merchant Map | Flash</title>

  <link rel="shortcut icon" type="image/png" href="../assets/img/favicon-32x32.png" sizes="32x32">
  <link rel="icon" type="image/png" href="../assets/img/favicon-16x16.png" sizes="16x16">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #3AB54A;
      --dark: #09090E;
      --text: #111218;
      --muted: #6B7280;
      --border: rgba(0,0,0,0.08);
      --sheet-radius: 20px;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
    }

    /* ── Map fills everything ── */
    #map {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* ── Top header bar ── */
    .map-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      padding-top: max(12px, env(safe-area-inset-top));
      background: rgba(9, 9, 14, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }

    .map-logo {
      display: flex;
      align-items: center;
      flex-shrink: 0;
      text-decoration: none;
    }

    .map-logo img {
      height: 28px;
      width: auto;
    }

    .map-search-wrap {
      flex: 1;
      position: relative;
    }

    .map-search-wrap svg {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255,255,255,0.4);
      pointer-events: none;
    }

    .map-search {
      width: 100%;
      background: rgba(255,255,255,0.09);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 8px 12px 8px 34px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      outline: none;
      transition: background 0.15s, border-color 0.15s;
    }

    .map-search::placeholder { color: rgba(255,255,255,0.38); }
    .map-search:focus {
      background: rgba(255,255,255,0.13);
      border-color: rgba(255,255,255,0.22);
    }

    .map-cta {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: var(--green);
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      border-radius: 10px;
      text-decoration: none;
      white-space: nowrap;
      transition: opacity 0.15s;
      flex-shrink: 0;
    }
    .map-cta:hover { opacity: 0.88; }
    .map-cta span { display: none; }

    @media (min-width: 600px) {
      .map-cta span { display: inline; }
    }

    /* ── Location count pill ── */
    .map-count {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      background: rgba(9,9,14,0.82);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 100px;
      padding: 6px 14px;
      color: rgba(255,255,255,0.7);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.02em;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .map-count.hidden { opacity: 0; }

    /* ── Bottom sheet ── */
    .map-sheet {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 200;
      background: #fff;
      border-radius: var(--sheet-radius) var(--sheet-radius) 0 0;
      box-shadow: 0 -8px 40px rgba(0,0,0,0.18);
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
      padding-bottom: max(16px, env(safe-area-inset-bottom));
      max-height: 72vh;
      overflow-y: auto;
    }
    .map-sheet.open { transform: translateY(0); }

    .sheet-handle-wrap {
      display: flex;
      justify-content: center;
      padding: 12px 0 4px;
    }
    .sheet-handle {
      width: 36px;
      height: 4px;
      background: #E5E7EB;
      border-radius: 2px;
    }

    .sheet-body {
      padding: 12px 20px 20px;
    }

    .sheet-merchant-name {
      font-family: 'Sora', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
      line-height: 1.2;
    }

    .sheet-username {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .sheet-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #F0FDF4;
      border: 1px solid #BBF7D0;
      border-radius: 100px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
      color: #15803D;
      margin-bottom: 20px;
    }

    .sheet-badge svg {
      color: var(--green);
    }

    .sheet-actions {
      display: flex;
      gap: 10px;
    }

    .sheet-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 16px;
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .sheet-btn:hover { opacity: 0.85; }

    .sheet-btn-primary {
      background: var(--green);
      color: #fff;
      border: none;
    }

    .sheet-btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1.5px solid var(--border);
    }

    /* ── Sheet backdrop ── */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      z-index: 150;
      background: rgba(0,0,0,0);
      pointer-events: none;
      transition: background 0.3s;
    }
    .sheet-backdrop.open {
      background: rgba(0,0,0,0.25);
      pointer-events: all;
    }

    /* ── Custom map markers ── */
    .flash-marker {
      width: 36px;
      height: 44px;
      cursor: pointer;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.28));
      transition: transform 0.15s;
    }
    .flash-marker:hover { transform: scale(1.1) translateY(-2px); }
    .flash-marker.active { transform: scale(1.15) translateY(-3px); }

    .flash-marker-pin {
      width: 36px;
      height: 36px;
      background: var(--green);
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(58, 181, 74, 0.4);
    }

    .flash-marker-pin img {
      width: 18px;
      height: 18px;
      transform: rotate(45deg);
      object-fit: contain;
    }

    .flash-marker-tip {
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 8px solid var(--green);
      margin: 0 auto;
    }

    /* ── No results state ── */
    .map-no-results {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 100;
      background: rgba(9,9,14,0.82);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 24px 32px;
      text-align: center;
      color: #fff;
      display: none;
    }
    .map-no-results.visible { display: block; }
    .map-no-results p { font-size: 14px; color: rgba(255,255,255,0.6); margin-top: 6px; }

    /* ── Loading state ── */
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .map-loading {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      background: rgba(9,9,14,0.82);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 100px;
      padding: 6px 14px;
      color: rgba(255,255,255,0.7);
      font-size: 12px;
      font-weight: 500;
      animation: pulse 1.4s ease infinite;
    }

    /* Google Maps UI overrides */
    .gm-style .gm-style-iw-c { display: none !important; }
    .gm-style .gm-style-iw-tc { display: none !important; }
    .gmnoprint, .gm-bundled-control { bottom: 80px !important; }
  </style>

  <!-- Google Maps -->
  <script>
    function initMap() { window.initMapCallback && window.initMapCallback(); }
  </script>
  <script async defer
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBrZtvg_PSLuDUcMQ9BapDyTlc821oLM2w&libraries=places,marker&callback=initMap&loading=async">
  </script>
</head>

<body>

  <!-- Header -->
  <header class="map-header">
    <a href="/" class="map-logo" aria-label="Flash home">
      <img src="../assets/img/logo-white.png" alt="Flash">
    </a>

    <div class="map-search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
      </svg>
      <input type="text" class="map-search" id="searchInput" placeholder="Search merchants…" autocomplete="off" autocorrect="off" spellcheck="false">
    </div>

    <a href="https://signup.getflash.io" class="map-cta" target="_blank" rel="noopener noreferrer">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      <span>Become a merchant</span>
    </a>
  </header>

  <!-- Map container -->
  <div id="map"></div>

  <!-- Loading / count pill -->
  <div class="map-loading" id="mapLoading">Loading merchants…</div>
  <div class="map-count hidden" id="mapCount"></div>

  <!-- No results -->
  <div class="map-no-results" id="mapNoResults">
    <strong>No merchants found</strong>
    <p>Try a different search term</p>
  </div>

  <!-- Sheet backdrop -->
  <div class="sheet-backdrop" id="sheetBackdrop"></div>

  <!-- Bottom sheet -->
  <div class="map-sheet" id="mapSheet" role="dialog" aria-modal="true" aria-label="Merchant details">
    <div class="sheet-handle-wrap">
      <div class="sheet-handle"></div>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>

  <script>
    'use strict';

    let map, markers = [], allFlashpoints = [], activeMarker = null;

    /* ── Map init ── */
    window.initMapCallback = async function () {
      map = new google.maps.Map(document.getElementById('map'), {
        center: { lat: 18.1096, lng: -77.2975 }, // Jamaica center
        zoom: 10,
        mapId: 'FLASH_MAP',
        disableDefaultUI: false,
        zoomControl: true,
        mapTypeControl: false,
        scaleControl: false,
        streetViewControl: false,
        rotateControl: false,
        fullscreenControl: false,
        clickableIcons: false,
        gestureHandling: 'greedy',
        styles: [
          { featureType: 'poi', elementType: 'labels', stylers: [{ visibility: 'off' }] },
          { featureType: 'transit', stylers: [{ visibility: 'off' }] }
        ]
      });

      // Close sheet on map click
      map.addListener('click', closeSheet);

      await loadFlashpoints();
    };

    /* ── Fetch merchants ── */
    async function loadFlashpoints() {
      const host = window.location.hostname;
      let apiUrl;
      if (host === 'localhost' || host === '127.0.0.1') {
        apiUrl = 'https://corsproxy.io/?https://api.flashapp.me/graphql';
      } else if (host === 'getflash.io' || host === 'www.getflash.io') {
        apiUrl = 'https://api.flashapp.me/graphql';
      } else {
        apiUrl = 'https://api.test.flashapp.me/graphql';
      }

      try {
        const res = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: `
            query BusinessMapMarkers {
              businessMapMarkers {
                mapInfo { coordinates { latitude longitude } title }
                username
              }
            }
          `})
        });

        const data = await res.json();
        allFlashpoints = data.data.businessMapMarkers;
        renderMarkers(allFlashpoints);
      } catch (err) {
        console.warn('API unavailable, using demo data:', err.message);
        allFlashpoints = MOCK_FLASHPOINTS;
        renderMarkers(allFlashpoints);
      }
    }

    /* ── Mock data (used when API is unavailable e.g. staging CORS) ── */
    const MOCK_FLASHPOINTS = [
      { mapInfo: { coordinates: { latitude: '17.9971', longitude: '-76.7936' }, title: 'Tastee Patties — New Kingston' }, username: 'tastee_nk' },
      { mapInfo: { coordinates: { latitude: '17.9957', longitude: '-76.7812' }, title: 'Island Grill Half Way Tree' }, username: 'islandgrill_hwt' },
      { mapInfo: { coordinates: { latitude: '18.0041', longitude: '-76.7503' }, title: 'Carib Cinema Liguanea' }, username: 'caribcinema' },
      { mapInfo: { coordinates: { latitude: '17.9886', longitude: '-76.7451' }, title: 'Sovereign Centre Food Court' }, username: 'sovereign_centre' },
      { mapInfo: { coordinates: { latitude: '18.0139', longitude: '-76.7901' }, title: 'Usain Bolt\'s Tracks & Records' }, username: 'tracks_records' },
      { mapInfo: { coordinates: { latitude: '17.9778', longitude: '-76.7823' }, title: 'Knutsford Express — Kingston' }, username: 'knutsford_kgn' },
      { mapInfo: { coordinates: { latitude: '18.4762', longitude: '-77.8970' }, title: 'Montego Bay Craft Market' }, username: 'mobay_craft' },
      { mapInfo: { coordinates: { latitude: '18.4724', longitude: '-77.9194' }, title: 'Doctor\'s Cave Beach Hotel' }, username: 'doctorscave' },
      { mapInfo: { coordinates: { latitude: '18.4655', longitude: '-77.9218' }, title: 'Hip Strip Souvenirs' }, username: 'hipstrip_gifts' },
      { mapInfo: { coordinates: { latitude: '18.1651', longitude: '-77.4069' }, title: 'Ochi Rios Jerk Centre' }, username: 'ochi_jerk' },
      { mapInfo: { coordinates: { latitude: '18.1696', longitude: '-76.4529' }, title: 'Port Antonio Marina Store' }, username: 'portantonio_marina' },
      { mapInfo: { coordinates: { latitude: '17.8668', longitude: '-77.6724' }, title: 'Mandeville Plaza Pharmacy' }, username: 'mandeville_pharmacy' },
    ];

    /* ── Render markers ── */
    async function renderMarkers(flashpoints) {
      // Clear existing
      markers.forEach(m => m.map = null);
      markers = [];

      const { AdvancedMarkerElement } = await google.maps.importLibrary('marker');

      flashpoints.forEach(fp => {
        const pos = {
          lat: parseFloat(fp.mapInfo.coordinates.latitude),
          lng: parseFloat(fp.mapInfo.coordinates.longitude)
        };

        const el = document.createElement('div');
        el.className = 'flash-marker';
        el.innerHTML = `
          <div class="flash-marker-pin">
            <img src="../assets/img/flash-icon-logo-white.png" alt="">
          </div>
        `;

        const marker = new AdvancedMarkerElement({
          map,
          position: pos,
          content: el,
          title: fp.mapInfo.title
        });

        marker.addListener('click', () => openSheet(fp, marker));
        markers.push(marker);
      });

      // Update UI
      const loading = document.getElementById('mapLoading');
      const count = document.getElementById('mapCount');
      loading.style.display = 'none';
      count.textContent = `${flashpoints.length} merchant${flashpoints.length !== 1 ? 's' : ''}`;
      count.classList.remove('hidden');

      // Fit map to markers if more than 1
      if (flashpoints.length > 1) {
        const bounds = new google.maps.LatLngBounds();
        flashpoints.forEach(fp => bounds.extend({
          lat: parseFloat(fp.mapInfo.coordinates.latitude),
          lng: parseFloat(fp.mapInfo.coordinates.longitude)
        }));
        map.fitBounds(bounds, 60);
      }
    }

    /* ── Bottom sheet ── */
    function openSheet(fp, marker) {
      // Reset previous active marker style
      if (activeMarker) {
        activeMarker.content.classList.remove('active');
      }
      marker.content.classList.add('active');
      activeMarker = marker;

      // Pan map so merchant is visible above the sheet
      const sheetHeight = window.innerHeight * 0.44;
      const projection = map.getProjection();
      if (projection) {
        const point = projection.fromLatLngToPoint(marker.position);
        const scale = Math.pow(2, map.getZoom());
        const offsetY = sheetHeight / (2 * scale);
        const newCenter = projection.fromPointToLatLng(
          new google.maps.Point(point.x, point.y + offsetY)
        );
        map.panTo(newCenter);
      } else {
        map.panTo(marker.position);
      }

      // Populate sheet
      const mapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${fp.mapInfo.coordinates.latitude},${fp.mapInfo.coordinates.longitude}`;
      const flashPayUrl = `https://pay.flashapp.me/${fp.username}`;

      document.getElementById('sheetBody').innerHTML = `
        <div class="sheet-merchant-name">${escHtml(fp.mapInfo.title)}</div>
        <div class="sheet-username">@${escHtml(fp.username)}</div>
        <div class="sheet-badge">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
          </svg>
          Accepts Flash Pay
        </div>
        <div class="sheet-actions">
          <a href="${mapsUrl}" target="_blank" rel="noopener noreferrer" class="sheet-btn sheet-btn-primary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0h6"/>
            </svg>
            Get Directions
          </a>
          <a href="${flashPayUrl}" target="_blank" rel="noopener noreferrer" class="sheet-btn sheet-btn-secondary">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
            Pay with Flash
          </a>
        </div>
      `;

      document.getElementById('mapSheet').classList.add('open');
      document.getElementById('sheetBackdrop').classList.add('open');
    }

    function closeSheet() {
      document.getElementById('mapSheet').classList.remove('open');
      document.getElementById('sheetBackdrop').classList.remove('open');
      if (activeMarker) {
        activeMarker.content.classList.remove('active');
        activeMarker = null;
      }
    }

    document.getElementById('sheetBackdrop').addEventListener('click', closeSheet);

    /* ── Search ── */
    document.getElementById('searchInput').addEventListener('input', function () {
      const q = this.value.trim().toLowerCase();
      const noResults = document.getElementById('mapNoResults');
      const count = document.getElementById('mapCount');

      if (!q) {
        renderMarkers(allFlashpoints);
        noResults.classList.remove('visible');
        return;
      }

      const filtered = allFlashpoints.filter(fp =>
        fp.mapInfo.title.toLowerCase().includes(q) ||
        fp.username.toLowerCase().includes(q)
      );

      renderMarkers(filtered);

      if (filtered.length === 0) {
        noResults.classList.add('visible');
        count.classList.add('hidden');
      } else {
        noResults.classList.remove('visible');
      }
    });

    /* ── Util ── */
    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
  </script>
</body>
</html>
