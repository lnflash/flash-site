<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="Keys of the Caribbean - A $5,000+ Bitcoin treasure hunt. 7 stages. 7 keys. 1 vault. Solve the code. Walk the island. Claim the sats.">
    <meta name="theme-color" content="#000000">
    
    <title>Keys of the Caribbean | The Hunt Begins</title>
    
    <!-- Preload critical assets -->
    <link rel="preload" href="assets/video/KOTC-Trailer.mp4" as="video" type="video/mp4">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="256x256" href="assets/img/kotc_icon_primary_256.png">
    <link rel="icon" type="image/png" sizes="512x512" href="assets/img/kotc_icon_primary_512.png">
    <link rel="apple-touch-icon" sizes="1024x1024" href="assets/img/kotc_icon_primary_1024.png">
    
    <!-- Open Graph -->
    <meta property="og:title" content="Keys of the Caribbean">
    <meta property="og:description" content="A $5,000+ Bitcoin treasure hunt across Jamaica. 7 stages. 7 keys. 1 vault.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="assets/img/kotc_icon_primary_1024.png">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Keys of the Caribbean">
    <meta name="twitter:description" content="A $5,000+ Bitcoin treasure hunt across Jamaica. 7 stages. 7 keys. 1 vault.">
    
    <!-- Styles -->
    <link rel="stylesheet" href="css/cinematic.css">
</head>
<body>
    <!-- CRT Scanlines Overlay -->
    <div class="scanlines"></div>
    
    <!-- ===== PHASE 1: BOOT SCREEN ===== -->
    <div id="boot-screen" class="boot-screen crt-flicker">
        <div class="boot-container">
            <!-- Header -->
            <div class="boot-header">
                <h1 class="boot-title glitch" data-text="KEY TERMINAL">KEY TERMINAL</h1>
                <div class="boot-subtitle">THE VAULT PROTOCOL</div>
            </div>
            
            <!-- Boot Messages -->
            <div id="boot-messages" class="boot-messages">
                <!-- Messages will be injected by JS -->
            </div>
            
            <!-- Progress Bar -->
            <div class="boot-progress">
                <div class="progress-label">
                    <span>DECRYPTION PROGRESS</span>
                    <span id="progress-percent">0%</span>
                </div>
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill"></div>
                    <span id="progress-text" class="progress-text">0%</span>
                </div>
            </div>
        </div>
    </div>
    
    <!-- ===== PHASE 2: VIDEO SCREEN ===== -->
    <div id="video-screen" class="video-screen">
        <!-- Cinematic letterbox bars -->
        <div class="letterbox-top"></div>
        <div class="letterbox-bottom"></div>
        
        <!-- Video -->
        <div class="video-wrapper">
            <video 
                id="trailer-video" 
                playsinline
                preload="auto"
                poster="assets/img/kotc_icon_primary_1024.png"
            >
                <source src="assets/video/KOTC-Trailer.mp4" type="video/mp4">
            </video>
        </div>
        
        <!-- Unmute Indicator -->
        <div id="unmute-indicator" class="unmute-indicator">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <line x1="23" y1="9" x2="17" y2="15"></line>
                <line x1="17" y1="9" x2="23" y2="15"></line>
            </svg>
            <div>TAP TO UNMUTE</div>
        </div>
        
        <!-- Skip Button -->
        <button id="skip-btn" class="skip-btn">SKIP →</button>
    </div>
    
    <!-- ===== PHASE 3: MAIN CONTENT ===== -->
    <div id="main-screen" class="main-screen">
        <!-- Back to Flash -->
        <a href="/" class="back-link">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Back to Flash
        </a>
        
        <div class="main-content">
            <!-- Logo -->
            <div class="logo-reveal">
                <img src="assets/img/kotc_lockup_horizontal_light.svg" alt="Keys of the Caribbean">
            </div>
            
            <!-- Title -->
            <h1 class="main-title">THE HUNT BEGINS</h1>
            <p class="main-subtitle">7 STAGES • 7 KEYS • 1 VAULT</p>
            
            <!-- CTA Buttons -->
            <div class="cta-container">
                <a href="register.html" class="cta-btn primary">BEGIN YOUR JOURNEY</a>
                <a href="rules.html" class="cta-btn secondary">VIEW RULES</a>
            </div>
            
            <!-- Stats -->
            <div class="stats-row">
                <div class="stat-item">
                    <div class="stat-value">$5K+</div>
                    <div class="stat-label">In Bitcoin Prizes</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">21</div>
                    <div class="stat-label">Rewards</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">∞</div>
                    <div class="stat-label">Adventure</div>
                </div>
            </div>
            
            <!-- Social Links -->
            <div class="social-links">
                <a href="https://twitter.com/LNFlash" target="_blank" class="social-link" aria-label="Twitter">
                    <svg viewBox="0 0 24 24">
                        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                    </svg>
                </a>
                <a href="https://discord.gg/8jCg8eCRhF" target="_blank" class="social-link" aria-label="Discord">
                    <svg viewBox="0 0 24 24">
                        <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
                    </svg>
                </a>
                <a href="https://www.instagram.com/getflash.io/" target="_blank" class="social-link" aria-label="Instagram">
                    <svg viewBox="0 0 24 24">
                        <rect x="2" y="2" width="20" height="20" rx="5" ry="5" fill="none" stroke="currentColor" stroke-width="2"/>
                        <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" fill="none" stroke="currentColor" stroke-width="2"/>
                        <line x1="17.5" y1="6.5" x2="17.51" y2="6.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </a>
                <a href="leaderboard.html" class="social-link" aria-label="Leaderboard">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                    </svg>
                </a>
            </div>
        </div>
    </div>
    
    <!-- Cinematic JavaScript -->
    <script src="js/cinematic.js"></script>
</body>
</html>
