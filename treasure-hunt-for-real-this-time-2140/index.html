    <link rel="preload" href="assets/video/KOTC_Trailer_v3_web.mp4" as="video" type="video/mp4">

    <!-- CRT Scanlines Overlay -->

    <!-- ===== PHASE 0: ENTER SCREEN ===== -->
    <div id="enter-screen" class="enter-screen">

            <video id="enter-bg-video" autoplay muted loop playsinline>

            </video>
            <div class="video-overlay"></div>
        </div>
        <div class="enter-content">
            <button id="enter-btn" class="enter-btn">

                <span class="enter-hint">Click to enable audio</span>
            </button>
            <button id="skip-intro-btn" class="skip-intro-btn">SKIP INTRO →</button>
        </div>
    </div>

    <!-- ===== PHASE 1: BOOT SCREEN ===== -->
    <div id="boot-screen" class="boot-screen crt-flicker">
        <div class="boot-container">
            <!-- Header -->
            <div class="boot-header">
                <h1 class="boot-title glitch" data-text="KEY TERMINAL">KEY TERMINAL</h1>
                <div class="boot-subtitle">THE VAULT PROTOCOL</div>
            </div>

            <!-- Boot Messages -->
            <div id="boot-messages" class="boot-messages">
                <!-- Messages will be injected by JS -->
            </div>

            <!-- Progress Bar -->
            <div class="boot-progress">
                <div class="progress-label">
                    <span>DECRYPTION PROGRESS</span>
                    <span id="progress-percent">0%</span>
                </div>
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill"></div>
                    <span id="progress-text" class="progress-text">0%</span>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== PHASE 2: VIDEO SCREEN ===== -->
    <div id="video-screen" class="video-screen">
        <!-- Cinematic letterbox bars -->
        <div class="letterbox-top"></div>
        <div class="letterbox-bottom"></div>

        <!-- Video -->
        <div class="video-wrapper">
            <video id="trailer-video" playsinline preload="auto" poster="assets/img/kotc_icon_primary_1024.png">
                <source src="assets/video/KOTC_Trailer_v3_web.mp4" type="video/mp4">
            </video>
        </div>

        <!-- Mute Toggle Button -->
        <button id="mute-btn" class="mute-btn" aria-label="Toggle sound">
            <svg class="sound-on" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
            </svg>
            <svg class="sound-off" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"

                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <line x1="23" y1="9" x2="17" y2="15"></line>
                <line x1="17" y1="9" x2="23" y2="15"></line>
            </svg>
        </button>

        <!-- Skip Button -->
        <button id="skip-btn" class="skip-btn">SKIP →</button>
    </div>

                    <line x1="17" y1="9" x2="23" y2="15"></line>
