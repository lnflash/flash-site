<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Primary Meta Tags -->
  <title>404 | Page Not Found | Flash</title>
  <meta name="title" content="404 | Page Not Found | Flash">
  <meta name="description" content="Looks like this page got lost in the mempool. Head back home and try again.">

  <!-- Canonical -->
  <link rel="canonical" href="https://getflash.io/404.html">

  <!-- Favicons -->
  <link rel="shortcut icon" type="image/png" href="assets/img/favicon-32x32.png" sizes="32x32" />
  <link rel="icon" type="image/png" href="assets/img/favicon-16x16.png" sizes="16x16" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="css/main.css" />

  <!-- Dark Mode Init -->
  <script src="js/core/dark-mode-init.js"></script>

  <style>
    /* ── 404 Page — Flash Design System ── */
    body.page-404 {
      --bg:           #FFFFFF;
      --surface-1:    #F7F8FA;
      --border:       #E5E7EB;
      --text-1:       #111218;
      --text-2:       #4B5563;
      --text-3:       #9CA3AF;
      --green:        #41AD49;
      --green-dim:    rgba(65, 173, 73, 0.10);
      --font-display: "Sora", sans-serif;
      --font-body:    "Inter", sans-serif;
    }

    body.page-404 {
      background: var(--bg);
      color: var(--text-1);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    .error-404 {
      min-height: calc(100vh - 140px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 24px;
      position: relative;
      overflow: hidden;
    }

    .error-404::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 400px;
      background: radial-gradient(ellipse, rgba(65, 173, 73, 0.05) 0%, transparent 70%);
      pointer-events: none;
    }

    .error-content {
      text-align: center;
      max-width: 560px;
      position: relative;
      z-index: 1;
    }

    .error-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--green);
      background: var(--green-dim);
      border: 1px solid rgba(65, 173, 73, 0.25);
      padding: 6px 14px;
      border-radius: 100px;
      margin-bottom: 28px;
    }

    .error-404-number {
      font-family: var(--font-display);
      font-size: clamp(80px, 15vw, 140px);
      font-weight: 800;
      line-height: 1;
      color: var(--text-1);
      margin-bottom: 8px;
      letter-spacing: -0.04em;
      position: relative;
    }

    .error-404-number .green-digit {
      color: var(--green);
    }

    .error-title {
      font-family: var(--font-display);
      font-size: clamp(20px, 3vw, 28px);
      font-weight: 700;
      color: var(--text-1);
      margin-bottom: 16px;
    }

    .error-message {
      font-size: 17px;
      color: var(--text-2);
      line-height: 1.65;
      margin-bottom: 40px;
    }

    .error-actions {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .error-button {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 700;
      padding: 13px 28px;
      border-radius: 100px;
      text-decoration: none !important;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .error-button.primary {
      background: var(--green);
      color: #fff !important;
    }

    .error-button.primary:hover {
      background: #37A344;
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(65, 173, 73, 0.35);
    }

    .error-button.secondary {
      background: transparent;
      color: var(--text-2) !important;
      border: 1.5px solid var(--border);
    }

    .error-button.secondary:hover {
      border-color: var(--text-2);
      background: var(--surface-1);
    }

    .error-extra {
      margin-top: 40px;
      font-size: 14px;
      color: var(--text-3);
    }

    .error-extra a {
      color: var(--green);
      font-weight: 600;
      text-decoration: none;
    }

    @media (max-width: 480px) {
      .error-actions {
        flex-direction: column;
        align-items: stretch;
      }

      .error-button {
        justify-content: center;
      }
    }
  </style>
</head>

<body class="page-404">
  <div id="header-placeholder"></div>

  <main>
    <section class="error-404">
      <div class="error-content">
        <div class="error-badge">⚡ Lost in the mempool</div>

        <div class="error-404-number">
          4<span class="green-digit">0</span>4
        </div>

        <h1 class="error-title">Looks like this page got lost in the mempool.</h1>

        <p class="error-message">
          It happens to the best of us. That URL is either gone, moved, or never existed in the first place. No fees lost though. Let's get you back.
        </p>

        <div class="error-actions">
          <a href="/" class="error-button primary">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            Go Home
          </a>
          <a href="https://wa.flashapp.me" target="_blank" rel="noopener" class="error-button secondary">
            Contact Support
          </a>
        </div>

        <p class="error-extra">
          Need help? Reach us on <a href="https://wa.flashapp.me" target="_blank">WhatsApp</a> or <a href="mailto:support@getflash.io">email</a>.
        </p>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>
  <div id="svg-icons-placeholder"></div>

  <!-- Load components -->
  <script src="js/core/component-loader.js"></script>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"
    integrity="sha256-2Pmvv0kuTBOenSvLm6bvfBSSHrUJ+3A7x6P5Ebd07/g=" crossorigin="anonymous"></script>
  <script src="js/core/main.js"></script>

  <!-- GSAP & Plugins CDN -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/MotionPathPlugin.min.js"></script>

  <!-- Custom JS -->
  <script src="js/modules/btcTracker.js"></script>

  <!-- Easter Egg -->
  <script>
    console.log('%c⚡ Flash 404 %c', 'color: #41AD49; font-size: 18px; font-weight: bold; background: #09090E; padding: 4px 8px; border-radius: 4px;', '');
    console.log('%cLost in the mempool? The real treasure is at getflash.io 🌴', 'color: #41AD49; font-size: 13px;');
  </script>

</body>

</html>
