  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:         #09090E;
      --bg-card:    rgba(255,255,255,0.05);
      --bg-card-hover: rgba(255,255,255,0.08);
      --border:     rgba(255,255,255,0.08);
      --border-hover: rgba(255,255,255,0.16);
      --green:      #3AB54A;
      --green-dim:  rgba(58,181,74,0.15);
      --green-glow: rgba(58,181,74,0.35);
      --text:       #ffffff;
      --text-muted: #888899;
      --text-dim:   #444455;
      --radius:     16px;
      --radius-lg:  22px;
    }

    html {
      background: var(--bg);
      min-height: 100%;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 48px 20px 40px;
      position: relative;
      overflow-x: hidden;
    }

    /* ── Background glows ── */
    body::before {
      content: '';
      position: fixed; top: -120px; left: 50%;
      transform: translateX(-50%);
      width: 600px; height: 500px;
      background: radial-gradient(ellipse, rgba(58,181,74,0.09) 0%, transparent 65%);
      pointer-events: none; z-index: 0;
    }
    body::after {
      content: '';
      position: fixed; bottom: -100px; right: -100px;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(58,181,74,0.06) 0%, transparent 65%);
      pointer-events: none; z-index: 0;
    }

    /* ── Grain overlay ── */
    .grain {
      position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0.025;
      background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");
      background-size: 200px 200px;
      mix-blend-mode: screen;
    }

    /* ── Card container ── */
    .card {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      position: relative; z-index: 2;
    }

    /* ── Header ── */
    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding-bottom: 36px;
      width: 100%;
    }

    .logo {
      height: 36px;
      width: auto;
      display: block;
    }

    .tagline {
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.2px;
      text-align: center;
    }

    /* ── Divider ── */
    .divider {
      width: 100%;
      height: 1px;
      background: var(--border);
      margin-bottom: 28px;
    }

    /* ── Links stack ── */
    .links {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    /* ── Base button ── */
    .link-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 18px 20px;
      border-radius: var(--radius-lg);
      text-decoration: none;
      border: 1px solid var(--border);
      background: var(--bg-card);
      cursor: pointer;
      transition:
        transform 120ms ease,
        background 160ms ease,
        border-color 160ms ease,
        box-shadow 160ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    .link-btn:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-hover);
      transform: translateY(-1px) scale(1.005);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    .link-btn:active {
      transform: scale(0.985);
      transition-duration: 60ms;
    }

    /* ── Primary CTA: Download ── */
    .link-btn--primary {
      background: var(--green);
      border-color: transparent;
      box-shadow: 0 0 0 rgba(58,181,74,0);
      transition:
        transform 120ms ease,
        box-shadow 160ms ease;
    }

    .link-btn--primary:hover {
      background: #3EC453;
      border-color: transparent;
      box-shadow: 0 6px 32px rgba(58,181,74,0.45), 0 2px 8px rgba(58,181,74,0.30);
      transform: translateY(-2px) scale(1.01);
    }

    .link-btn--primary .btn-label,
    .link-btn--primary .btn-chevron { color: #000; }
    .link-btn--primary .btn-icon { color: #000; opacity: 0.75; }

    /* ── Icon ── */
    .btn-icon {
      width: 40px; height: 40px; flex-shrink: 0;
      border-radius: 10px;
      background: rgba(255,255,255,0.08);
      display: flex; align-items: center; justify-content: center;
      color: var(--text);
    }

    .link-btn--primary .btn-icon {
      background: rgba(0,0,0,0.15);
    }

    .btn-icon svg {
      width: 20px; height: 20px;
      display: block;
    }

    /* ── Label ── */
    .btn-label {
      flex: 1;
      font-family: 'Sora', sans-serif;
      font-weight: 700;
      font-size: 17px;
      color: var(--text);
      letter-spacing: -0.2px;
    }

    /* ── Chevron ── */
    .btn-chevron {
      flex-shrink: 0;
      color: var(--text-dim);
      transition: transform 160ms ease, color 160ms ease;
    }

    .link-btn:hover .btn-chevron {
      transform: translateX(2px);
      color: var(--text-muted);
    }
    .link-btn--primary:hover .btn-chevron { color: rgba(0,0,0,0.5); }

    /* ── Footer ── */
    .footer {
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .footer-logo {
      height: 22px;
      width: auto;
      opacity: 0.35;
    }

    .footer-copy {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      color: var(--text-dim);
      text-align: center;
      letter-spacing: 0.1px;
    }

    /* ── Responsive ── */
    @media (max-width: 360px) {
      body { padding: 36px 16px 32px; }
      .btn-label { font-size: 16px; }
    }

    @media (min-width: 600px) {
      body { padding: 72px 24px 60px; }
    }
  </style>
