name: CI

on:
  push:
    branches: [main, kotc]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax-check JS modules
        run: |
          for f in js/core/*.js js/modules/*.js; do
            node --check "$f"
          done

      - name: Run tests
        run: node --test tests/
