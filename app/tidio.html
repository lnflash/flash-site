<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash Support</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #f9fafb;
        }
        .redirect-msg {
            text-align: center;
            padding: 2rem;
        }
        .redirect-msg p {
            color: #6b7280;
            margin-bottom: 1rem;
        }
        .redirect-msg a {
            display: inline-block;
            background: #25D366;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
        }
    </style>
</head>

<body>
    <div class="redirect-msg">
        <p>Redirecting to WhatsApp support...</p>
        <a href="https://wa.flashapp.me">Open WhatsApp</a>
    </div>
    <script>
        window.location.href = 'https://wa.flashapp.me';
    </script>
</body>

</html>
