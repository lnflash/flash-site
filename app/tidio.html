<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <style>
        body {
            margin: 0;
            padding: 0 0 0 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .chat-container {
            padding: 50px 0 0 0;
            height: calc(100vh - 60px);
            width: 100vw;
            overflow: hidden;
            margin-top: 60px;
            padding-top: env(safe-area-inset-top);
        }
    </style>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FH0PPEWMBP"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-FH0PPEWMBP');
    </script>
</head>

<body>
    <div>
        <div class="chat-container">
            <div id="top-spacer" style="height: 20px;"></div>
        </div>
    </div>

    <!-- Chatwoot -->
    <script>
        window.chatwootSettings = { "position": "right", "type": "standard", "launcherTitle": "" };
        (function (d, t) {
            var BASE_URL = "https://support.getflash.io/";
            var g = d.createElement(t), s = d.getElementsByTagName(t)[0];
            g.src = BASE_URL + "/packs/js/sdk.js";
            g.async = true;
            s.parentNode.insertBefore(g, s);
            g.onload = function () {
                window.chatwootSDK.run({
                    websiteToken: '8J2iDCw5f6dgxGa1UFvP1aww',
                    baseUrl: BASE_URL
                })
            }
        })(document, "script");
    </script>

    <script>
        // Open chat automatically once Chatwoot is ready
        window.addEventListener('chatwoot:ready', function () {
            window.$chatwoot.toggle('open');
        });

        // Fallback: open after a short delay
        setTimeout(function () {
            if (window.$chatwoot) {
                window.$chatwoot.toggle('open');
            }
        }, 2000);
    </script>
</body>

</html>
